<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Stacker - Play Game</title>
  <!-- Firebase SDK CDN 추가 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 800px;
      background: linear-gradient(to bottom, #1E293B, #0F172A);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
    .ui-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column;
      justify-content: space-between; padding: 24px;
    }
    .header-ui {
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 900; font-size: 1.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .score-box { color: #38BDF8; }
    .combo-box { color: #FACC15; font-size: 1rem; }
    
    .screen-center {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; z-index: 10; pointer-events: auto; transition: opacity 0.3s ease;
    }
    .screen-center.hidden { opacity: 0; pointer-events: none; display: none; }
    h1 {
      font-size: 2.5rem; font-weight: 900;
      background: linear-gradient(to right, #22D3EE, #E879F9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
    }
    p { color: #94A3B8; margin-bottom: 20px; font-size: 0.95rem; }
    .input-group { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; max-width: 300px; }
    input[type="text"] {
      flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid #334155;
      background: #1E293B; color: #F8FAFC; font-weight: 700; font-size: 1rem; outline: none;
    }
    input[type="text"]:focus { border-color: #22D3EE; }
    .btn {
      background: linear-gradient(to right, #22D3EE, #3B82F6); color: #0F172A;
      font-weight: 800; font-size: 1.05rem; padding: 12px 24px; border: none;
      border-radius: 9999px; cursor: pointer; box-shadow: 0 10px 20px rgba(34, 211, 238, 0.3);
      transition: all 0.2s; text-decoration: none; display: inline-block;
    }
    .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
    .btn:active { transform: scale(0.95); }
    .btn-secondary { background: #334155; color: #F8FAFC; box-shadow: none; margin-top: 12px; font-size: 0.9rem; padding: 10px 20px; }
    .save-msg { color: #4ADE80; font-size: 0.85rem; font-weight: 700; margin-bottom: 16px; height: 20px; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="ui-overlay">
      <div class="header-ui">
        <div class="score-box" id="currentScore">0층</div>
        <div class="combo-box" id="comboText"></div>
      </div>
    </div>

    <div id="startScreen" class="screen-center">
      <h1>SKY STACKER</h1>
      <p>실시간 클라우드 랭킹 모드</p>
      <button class="btn" onclick="startGame()">게임 시작</button>
      <a href="index.html" class="btn btn-secondary">홈으로 돌아가기</a>
    </div>

    <div id="gameOverScreen" class="screen-center hidden">
      <h1>GAME OVER</h1>
      <p id="finalScoreText" style="font-size: 1.25rem; color: #F8FAFC; font-weight: 800; margin-bottom: 4px;">최종 기록: 0층</p>
      
      <div class="input-group" id="rankInputBox">
        <input type="text" id="playerNameInput" placeholder="닉네임 입력 (최대 10자)" maxlength="10" />
        <button class="btn" style="border-radius: 12px; padding: 12px 18px;" onclick="saveScoreToCloud()">등록</button>
      </div>
      <div class="save-msg" id="saveMessage"></div>

      <button class="btn" onclick="startGame()">다시 하기</button>
      <a href="index.html#leaderboard" class="btn btn-secondary">실시간 명예의 전당 보기 🏆</a>
    </div>
  </div>

  <script>
    // 🔥 [중요] 본인의 Firebase 콘솔 설정값으로 교체하세요!
    const firebaseConfig = {
        apiKey: "AIzaSyDWycAj6uMSRScJZ6Ogd-vHLcJfHXDzz0c",
        authDomain: "sky-stacker-50fc4.firebaseapp.com",
        projectId: "sky-stacker-50fc4",
        storageBucket: "sky-stacker-50fc4.firebasestorage.app",
        messagingSenderId: "1003890691469",
        appId: "1:1003890691469:web:a4076cd2e52f6ef23281c4",
        measurementId: "G-018Z6ET7WR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 480;
    canvas.height = 800;

    let gameState = 'START';
    let score = 0;
    let combo = 0;
    let cameraY = 0;
    let targetCameraY = 0;
    let startTime = 0;
    let playDuration = 0;
    let isScoreSaved = false;

    let blocks = [];
    let currentBlock = null;
    let cutPieces = [];

    const blockHeight = 35;
    const initialBlockWidth = 200;
    let currentWidth = initialBlockWidth;
    let blockSpeed = 3;

    class Block {
      constructor(x, y, width, height, colorIndex) {
        this.x = x; this.y = y; this.width = width; this.height = height;
        this.colorIndex = colorIndex; this.dir = 1;
      }
      update() {
        this.x += blockSpeed * this.dir;
        if (this.x < 40 || this.x + this.width > canvas.width - 40) this.dir *= -1;
      }
      draw() {
        const color = getBlockColor(this.colorIndex);
        ctx.fillStyle = color.top; ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.fillStyle = color.side; ctx.fillRect(this.x, this.y + this.height, this.width, 8);
      }
    }

    class CutPiece {
      constructor(x, y, width, height, colorIndex, dir) {
        this.x = x; this.y = y; this.width = width; this.height = height;
        this.colorIndex = colorIndex; this.vx = dir * 2; this.vy = -2;
        this.gravity = 0.4; this.rotation = 0; this.vRot = dir * 0.05;
      }
      update() { this.x += this.vx; this.y += this.vy; this.vy += this.gravity; this.rotation += this.vRot; }
      draw() {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
        ctx.rotate(this.rotation);
        const color = getBlockColor(this.colorIndex);
        ctx.fillStyle = color.top; ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
        ctx.restore();
      }
    }

    function getBlockColor(index) {
      const hue = (index * 15) % 360;
      return { top: `hsl(${hue}, 80%, 60%)`, side: `hsl(${hue}, 80%, 40%)` };
    }

    function startGame() {
      gameState = 'PLAYING';
      score = 0; combo = 0; currentWidth = initialBlockWidth; blockSpeed = 3;
      blocks = []; cutPieces = []; cameraY = 0; targetCameraY = 0;
      startTime = Date.now(); isScoreSaved = false;

      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('currentScore').innerText = '0층';
      document.getElementById('comboText').innerText = '';
      document.getElementById('saveMessage').innerText = '';
      document.getElementById('rankInputBox').style.display = 'flex';

      const baseBlock = new Block((canvas.width - initialBlockWidth) / 2, canvas.height - 150, initialBlockWidth, blockHeight, 0);
      blocks.push(baseBlock);
      spawnNewBlock();
    }

    function spawnNewBlock() {
      const lastBlock = blocks[blocks.length - 1];
      const nextY = lastBlock.y - blockHeight;
      blockSpeed = 3 + Math.floor(blocks.length / 5) * 0.5;
      currentBlock = new Block(40, nextY, currentWidth, blockHeight, blocks.length);
    }

    function dropBlock() {
      if (gameState !== 'PLAYING') return;

      const lastBlock = blocks[blocks.length - 1];
      const diff = currentBlock.x - lastBlock.x;
      const absDiff = Math.abs(diff);

      if (absDiff < 4) {
        currentBlock.x = lastBlock.x;
        combo++;
        if (combo >= 3) {
          currentWidth = Math.min(initialBlockWidth, currentWidth + 10);
          currentBlock.width = currentWidth;
          showComboText('✨ PERFECT + 콤보 보상!');
          combo = 0;
        } else {
          showComboText('🔥 PERFECT!');
        }
        blocks.push(currentBlock);
        score++;
      } else if (absDiff < currentWidth) {
        combo = 0; showComboText('');
        const overlapWidth = currentWidth - absDiff;
        let cutWidth = absDiff;
        let cutX = diff > 0 ? currentBlock.x + overlapWidth : currentBlock.x;

        cutPieces.push(new CutPiece(cutX, currentBlock.y, cutWidth, blockHeight, currentBlock.colorIndex, diff > 0 ? 1 : -1));
        currentWidth = overlapWidth;
        currentBlock.width = overlapWidth;
        if (diff <= 0) currentBlock.x = lastBlock.x;

        blocks.push(currentBlock);
        score++;
      } else {
        gameState = 'GAMEOVER';
        playDuration = Math.floor((Date.now() - startTime) / 1000);
        cutPieces.push(new CutPiece(currentBlock.x, currentBlock.y, currentWidth, blockHeight, currentBlock.colorIndex, 1));
        showGameOver();
        return;
      }

      document.getElementById('currentScore').innerText = `${score}층`;
      if (blocks.length > 5) targetCameraY += blockHeight;
      spawnNewBlock();
    }

    function showComboText(text) {
      const el = document.getElementById('comboText');
      el.innerText = text;
      setTimeout(() => { if (el.innerText === text) el.innerText = ''; }, 1000);
    }

    function showGameOver() {
      document.getElementById('finalScoreText').innerText = `최종 기록: ${score}층`;
      if (score === 0) document.getElementById('rankInputBox').style.display = 'none';
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    // 파이어베이스 클라우드에 점수 저장
    async function saveScoreToCloud() {
      if (isScoreSaved || score === 0) return;

      const inputEl = document.getElementById('playerNameInput');
      let playerName = inputEl.value.trim().toUpperCase() || 'ANONYMOUS';

      const mins = String(Math.floor(playDuration / 60)).padStart(2, '0');
      const secs = String(playDuration % 60).padStart(2, '0');
      const formattedTime = `${mins}:${secs}`;

      try {
        await db.collection('leaderboard').add({
          name: playerName,
          score: score,
          time: formattedTime,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        isScoreSaved = true;
        document.getElementById('rankInputBox').style.display = 'none';
        document.getElementById('saveMessage').innerText = `✅ 실시간 클라우드 등록 완료!`;
      } catch (error) {
        console.error("Error adding document: ", error);
        document.getElementById('saveMessage').innerText = `❌ 저장 실패 (네트워크를 확인하세요)`;
      }
    }

    window.addEventListener('mousedown', (e) => {
      if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'A') dropBlock();
    });
    window.addEventListener('touchstart', (e) => {
      if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'A') {
        e.preventDefault(); dropBlock();
      }
    }, { passive: false });
    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') {
        if (e.code === 'Enter') saveScoreToCloud();
        return;
      }
      if (e.code === 'Space') { e.preventDefault(); dropBlock(); }
    });

    function gameLoop() {
      cameraY += (targetCameraY - cameraY) * 0.1;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(0, cameraY);

      ctx.strokeStyle = '#1E293B'; ctx.lineWidth = 1;
      for (let i = -10; i < 50; i++) {
        ctx.beginPath(); ctx.moveTo(0, i * 100); ctx.lineTo(canvas.width, i * 100); ctx.stroke();
      }

      blocks.forEach(block => block.draw());
      if (gameState === 'PLAYING' && currentBlock) {
        currentBlock.update(); currentBlock.draw();
      }
      cutPieces.forEach((p, index) => {
        p.update(); p.draw();
        if (p.y > canvas.height + cameraY + 200) cutPieces.splice(index, 1);
      });

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
