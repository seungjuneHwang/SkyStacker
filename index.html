<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Stacker - 공식 게임 소개 페이지</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK CDN 추가 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #0F172A; color: #F8FAFC; }
    .neon-text-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.6), 0 0 20px rgba(6, 182, 212, 0.4); }
    .neon-border { box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); }
    .neon-border:hover { box-shadow: 0 0 25px rgba(56, 189, 248, 0.45); }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
    .floating-tower { animation: float 4s ease-in-out infinite; }
  </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-black">

  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-cyan-500 to-fuchsia-500 flex items-center justify-center font-black text-xl text-slate-950">🏗️</div>
        <span class="font-extrabold text-2xl tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-fuchsia-400">SKY STACKER</span>
      </a>
      <a href="game.html" class="px-5 py-2.5 rounded-full font-bold text-sm bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 shadow-lg shadow-cyan-500/25 transition-all hover:scale-105">PLAY NOW</a>
    </div>
  </header>

  <section id="hero" class="relative min-h-[calc(100vh-5rem)] flex items-center justify-center px-6 py-16 overflow-hidden">
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-center relative z-10">
      <div class="text-center lg:text-left space-y-6">
        <h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-none">
          UNLEASH YOUR <br />
          <span class="bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-fuchsia-500 neon-text-cyan">TIMING!</span>
        </h1>
        <p class="text-slate-400 text-lg max-w-xl mx-auto lg:mx-0">전 세계 친구들과 실시간으로 타워 높이를 경쟁하세요!</p>
        <a href="game.html" class="inline-flex px-8 py-4 rounded-2xl font-black text-lg bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 shadow-2xl hover:scale-105 transition-all">START STACKING ▶</a>
      </div>
    </div>
  </section>

  <!-- LEADERBOARD SECTION -->
  <section id="leaderboard" class="py-24 bg-slate-900/50 border-t border-slate-800 px-6">
    <div class="max-w-4xl mx-auto">
      <div class="text-center space-y-4 mb-12">
        <h2 class="text-xs font-bold tracking-widest text-cyan-400 uppercase">[LIVE CLOUD LEADERBOARD]</h2>
        <h3 class="text-3xl sm:text-4xl font-black">실시간 명예의 전당</h3>
      </div>

      <div class="bg-slate-800/50 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-900/80 text-xs font-bold text-slate-400 uppercase border-b border-slate-700">
                <th class="py-4 px-6">RANK</th>
                <th class="py-4 px-6">PLAYER NAME</th>
                <th class="py-4 px-6">TOWERS / BLOCKS</th>
                <th class="py-4 px-6">TIME</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody" class="divide-y divide-slate-700/50 text-sm font-semibold">
              <tr><td colspan="4" class="py-8 text-center text-slate-400">클라우드에서 랭킹 데이터를 불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- 파이어베이스 실시간 연동 스크립트 -->
  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyDWycAj6uMSRScJZ6Ogd-vHLcJfHXDzz0c",
        authDomain: "sky-stacker-50fc4.firebaseapp.com",
        projectId: "sky-stacker-50fc4",
        storageBucket: "sky-stacker-50fc4.firebasestorage.app",
        messagingSenderId: "1003890691469",
        appId: "1:1003890691469:web:a4076cd2e52f6ef23281c4",
        measurementId: "G-018Z6ET7WR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function fetchCloudLeaderboard() {
      const tbody = document.getElementById('leaderboardBody');
      try {
        // 점수 높은 순(desc)으로 상위 10개 가져오기
        const snapshot = await db.collection('leaderboard').orderBy('score', 'desc').limit(10).get();
        
        if (snapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-slate-400">아직 등록된 기록이 없습니다. 첫 주자가 되어보세요!</td></tr>`;
          return;
        }

        let html = '';
        snapshot.forEach((doc, idx) => {
          const data = doc.data();
          let rankDisplay = idx + 1;
          let rankClass = 'text-slate-500';

          if (idx === 0) { rankDisplay = '🥇 1'; rankClass = 'text-amber-400 font-bold'; }
          else if (idx === 1) { rankDisplay = '🥈 2'; rankClass = 'text-slate-300 font-bold'; }
          else if (idx === 2) { rankDisplay = '🥉 3'; rankClass = 'text-amber-600 font-bold'; }

          html += `
            <tr class="hover:bg-cyan-950/30 transition-colors">
              <td class="py-4 px-6 ${rankClass}">${rankDisplay}</td>
              <td class="py-4 px-6 text-slate-100">${escapeHTML(data.name)}</td>
              <td class="py-4 px-6 text-cyan-400 font-extrabold">${data.score} BLOCKS</td>
              <td class="py-4 px-6 text-slate-400">${data.time || '00:00'}</td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      } catch (error) {
        console.error("Error fetching leaderboard: ", error);
        tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-rose-400">랭킹을 불러오지 못했습니다. (Firebase 설정 확인 필요)</td></tr>`;
      }
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    window.addEventListener('DOMContentLoaded', fetchCloudLeaderboard);
  </script>
</body>
</html>
