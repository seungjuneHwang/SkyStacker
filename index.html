<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Stacker - 공식 게임 소개 페이지</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Pretendard -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
    }
    
    .neon-text-cyan {
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.6), 0 0 20px rgba(6, 182, 212, 0.4);
    }
    .neon-border {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }
    .neon-border:hover {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.45);
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    .floating-tower {
      animation: float 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-black">

  <!-- ==================== 1. HEADER ==================== -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <!-- 로고 -->
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-cyan-500 to-fuchsia-500 flex items-center justify-center font-black text-xl text-slate-950 group-hover:scale-105 transition-transform">
          🏗️
        </div>
        <span class="font-extrabold text-2xl tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-fuchsia-400">
          SKY STACKER
        </span>
      </a>

      <!-- 네비게이션 메뉴 -->
      <nav class="hidden md:flex items-center gap-8 text-sm font-semibold tracking-wide text-slate-300">
        <a href="#hero" class="hover:text-cyan-400 transition-colors">HOME</a>
        <a href="#features" class="hover:text-cyan-400 transition-colors">FEATURES</a>
        <a href="#how-to-play" class="hover:text-cyan-400 transition-colors">HOW TO PLAY</a>
        <a href="#leaderboard" class="hover:text-cyan-400 transition-colors">LEADERBOARD</a>
      </nav>

      <!-- CTA 버튼 -> game.html로 연결 -->
      <a href="game.html" class="px-5 py-2.5 rounded-full font-bold text-sm bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 shadow-lg shadow-cyan-500/25 transition-all hover:scale-105">
        PLAY NOW
      </a>
    </div>
  </header>

  <!-- ==================== 2. HERO SECTION ==================== -->
  <section id="hero" class="relative min-h-[calc(100vh-5rem)] flex items-center justify-center px-6 py-16 overflow-hidden">
    <div class="absolute inset-0 opacity-20 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)]"></div>
    
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-center relative z-10">
      <div class="text-center lg:text-left space-y-6">
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-cyan-500/30 bg-cyan-950/40 text-cyan-400 text-xs font-semibold tracking-wider uppercase">
          <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
          AWARENESS & CONVERSION
        </div>
        
        <h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-none">
          UNLEASH YOUR <br />
          <span class="bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-fuchsia-500 neon-text-cyan">
            TIMING!
          </span>
        </h1>
        
        <p class="text-slate-400 text-lg max-w-xl mx-auto lg:mx-0 leading-relaxed font-normal">
          하늘을 찌르는 나만의 타워를 건설하세요. 완벽한 타이밍에 블록을 맞춰 놓고 별을 향해 더 높이 올라가세요!
        </p>

        <!-- 메인 CTA 버튼 -> game.html로 연결 -->
        <div class="pt-4 flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4">
          <a href="game.html" class="w-full sm:w-auto px-8 py-4 rounded-2xl font-black text-lg bg-gradient-to-r from-cyan-400 via-sky-400 to-blue-600 hover:from-cyan-300 hover:to-blue-500 text-slate-950 shadow-2xl shadow-cyan-500/40 transition-all hover:scale-105 active:scale-95 flex items-center justify-center gap-3 no-underline">
            <span>START STACKING</span>
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v1
